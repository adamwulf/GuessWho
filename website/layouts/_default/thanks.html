<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <meta name="description" content="Your GuessWho TestFlight signup was received.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1b34" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="{{ "images/app-icon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body class="thanks-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ "" | relURL }}">
        <img class="brand-icon" src="{{ "images/app-icon.png" | relURL }}" width="36" height="36" alt="" decoding="async">
        <span class="brand-name">{{ .Site.Title }}</span>
      </a>
    </div>
  </header>

  <main class="thanks-main">
    <div class="wrap">
      <section class="thanks-card" aria-labelledby="thanks-title">
        <img class="thanks-icon" src="{{ "images/app-icon.png" | relURL }}" width="80" height="80" alt="">
        <p class="eyebrow">TestFlight signup received</p>
        <h1 id="thanks-title">{{ .Title }}</h1>
        <div class="section-lead">{{ .Content }}</div>
        <a class="btn btn-primary" href="{{ "" | relURL }}">Back to GuessWho</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; {{ now.Year }} Milestone Made, LLC. GuessWho.</p>
      <a class="github-link" href="https://github.com/adamwulf/GuessWho" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .5Z"/>
        </svg>
        <span>View on GitHub</span>
      </a>
      <p class="footer-note">All your data stays on your device.</p>
    </div>
  </footer>
</body>
</html>
