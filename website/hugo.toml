# GuessWho marketing site — Hugo configuration.
# Mirrors the Mantra Moment website setup: a single-page, hand-written static
# site with no build step beyond Hugo itself.

baseURL = "/"
languageCode = "en-us"
title = "GuessWho"

# Single page only — no content section, no taxonomies, no RSS.
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
  description = "Never forget a name again. GuessWho connects people to organizations, departments, events, notes, and each other so the context comes back when you need it."
  ctaURL = "#testflight"
  ctaLabel = "Join the TestFlight"

[minify]
  disableXML = true
